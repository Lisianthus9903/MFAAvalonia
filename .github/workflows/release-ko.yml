name: Korean Build (fork)

# Fork-only workflow for the ko-KR build.
# - workflow_dispatch: build Windows x64/arm64 and upload zip artifacts.
# - push tag ko-v*:   same, then create a GitHub release in this fork.
# No secrets and no external upload (MirrorChyan etc.) are used.

on:
  push:
    tags:
      - 'ko-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (win-${{ matrix.arch }})
    if: ${{ github.repository_owner != 'SweetSmellFox' && github.repository_owner != 'MaaXYZ' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Determine version label
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/ko-v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ko-dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Korean resources
        shell: bash
        run: |
          test -f MFAAvalonia/Assets/Localization/Strings.ko-KR.resx \
            || { echo "[ERR] Strings.ko-KR.resx is missing"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -r win-${{ matrix.arch }}
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

      - name: Publish
        run: dotnet publish MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r win-${{ matrix.arch }}
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

      - name: Package ZIP
        shell: bash
        run: |
          BUILD_DIR="bin/AnyCPU/Release/win-${{ matrix.arch }}/publish"
          OUTPUT_FILE="MFAAvalonia-${{ steps.meta.outputs.tag }}-win-${{ matrix.arch }}.zip"
          find "$BUILD_DIR" -type d -name 'ko-KR' | grep -q . \
            || { echo "[ERR] ko-KR satellite assembly not found in publish output"; exit 1; }
          cd "$BUILD_DIR"
          7z a -tzip "../$OUTPUT_FILE" *

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          path: bin/AnyCPU/Release/win-${{ matrix.arch }}/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    if: ${{ startsWith(github.ref, 'refs/tags/ko-v') }}
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
